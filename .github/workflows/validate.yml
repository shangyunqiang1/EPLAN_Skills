name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r plugins/eplan-skills/requirements/runtime.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m pytest tests plugins/eplan-skills/vendor/eplan-mcp/eplan-p8-mcp-server/tests -m "not live" -q
      - name: Set up external runtime
        shell: pwsh
        run: |
          $env:EPLAN_SKILLS_DATA_DIR = Join-Path $env:RUNNER_TEMP 'eplan-skills-runtime'
          "EPLAN_SKILLS_DATA_DIR=$env:EPLAN_SKILLS_DATA_DIR" >> $env:GITHUB_ENV
          ./plugins/eplan-skills/scripts/setup.ps1
      - run: python scripts/smoke_mcp.py
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: eplan-skills-python-${{ matrix.python }}
          path: dist/*
